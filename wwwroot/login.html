<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - ChatApp</title>

    <link rel="stylesheet"
          href="/css/login.css">

</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <!-- LOGO -->

            <div class="logo">

                <div class="logo-icon">
                    💬
                </div>

                <h1>ChatApp</h1>

                <p>
                    Real-Time Messaging
                </p>

            </div>


            <!-- LOGIN FORM -->

            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required>

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-container">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required>

                        <button
                            type="button"
                            id="togglePassword"
                            class="toggle-password">
                            👁
                        </button>

                    </div>

                </div>


                <!-- ERROR MESSAGE -->

                <div
                    id="loginError"
                    class="error-message">
                </div>


                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    id="loginButton"
                    class="login-button">

                    <span id="loginButtonText">
                        Login
                    </span>

                </button>

            </form>


            <!-- REGISTER -->

            <div class="register-link">

                <p>
                    Don't have an account?
                    <a href="/register.html">
                        Create an account
                    </a>
                </p>

            </div>

        </div>

    </div>


    <script src="/js/login.js"></script>

</body>

</html>
